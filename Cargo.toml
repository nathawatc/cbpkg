[package]
name = "cbpkg"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }
tar = "0.4"
zstd = "0.13"
rpassword = "7.3"
tempfile = "3.17"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.8"
